# GitHub Actions: 自动打包分发
#
# 触发方式：
# 1. 推送 v* tag（如 v0.19.61）：构建各平台产物并发布到 GitHub Releases
#    tag 必须与 apps/electron/package.json 的 version 一致
# 2. 手动 workflow_dispatch：只构建并把产物上传为 Actions artifact，
#    不创建 Release、不覆盖已有工件，用于验证打包流程
#
# 签名证书均为可选：
# - macOS 未配置 MAC_CERTS 时跳过签名，产出未签名包；用户需右键打开，或执行
#   xattr -dr com.apple.quarantine /Applications/Locus.app
# - Windows 始终产出未签名包，用户首次运行会遇到 SmartScreen 提示
#
# 可选 GitHub Secrets（macOS 签名/公证）:
# - MAC_CERTS: Base64 编码的 macOS Developer ID Application 证书 (.p12)
# - MAC_CERTS_PASSWORD: 证书密码
# - APPLE_ID: Apple ID（公证用）
# - APPLE_APP_SPECIFIC_PASSWORD: App-Specific 密码（公证用）
# - APPLE_TEAM_ID: Apple Developer Team ID
# GITHUB_TOKEN 由 GitHub Actions 自动提供，无需手动配置

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 推送 tag 时直接发布到 GitHub Releases；手动触发时只产出 artifact
  PUBLISH_MODE: ${{ github.event_name == 'push' && 'always' || 'never' }}

jobs:
  build-mac-arm64:
    name: build (macos-latest, mac, arm64, --arm64)
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（macOS arm64）
        run: bun run --filter='@proma/electron' prepare:officecli

      # macOS 代码签名准备（未配置证书时跳过，产出未签名包）
      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          if [ -z "${MAC_CERTS:-}" ]; then
            echo "::notice::未配置 MAC_CERTS，跳过证书导入，本次产出未签名 macOS 包"
            exit 0
          fi

          # 创建临时 keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入证书
          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      # 构建应用
      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 准备运行时依赖
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      # 打包并发布到 GitHub Releases
      - name: 打包并发布 (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for i in 1 2 3; do
            if bun run package:app --mac --arm64 --publish "$PUBLISH_MODE"; then
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done

          echo "macOS ARM64 packaging failed after 3 attempts"
          exit 1
        working-directory: apps/electron

      # 手动触发时把产物上传为 Actions artifact（tag 推送由 electron-builder 直接发布）
      - name: 验证包内原生模块、终端与 CLI
        run: bun run scripts/smoke-package.ts
        working-directory: apps/electron

      - name: 上传产物（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64
          path: |
            apps/electron/out/*.dmg
            apps/electron/out/*.zip
            apps/electron/out/*.blockmap
            apps/electron/out/latest-mac.yml
          if-no-files-found: warn


      - name: 保存架构更新清单
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-manifest
          path: apps/electron/out/latest-mac.yml
          if-no-files-found: error

  build-mac-x64:
    name: build (macos-15-intel, mac, x64, --x64)
    runs-on: macos-15-intel

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（macOS x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      # macOS 代码签名准备（未配置证书时跳过，产出未签名包）
      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          if [ -z "${MAC_CERTS:-}" ]; then
            echo "::notice::未配置 MAC_CERTS，跳过证书导入，本次产出未签名 macOS 包"
            exit 0
          fi

          # 创建临时 keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入证书
          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      # 构建应用
      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 准备运行时依赖
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      # 打包并发布到 GitHub Releases
      - name: 打包并发布 (macOS x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for i in 1 2 3; do
            if bun run package:app --mac --x64 --publish "$PUBLISH_MODE"; then
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 15s..."
              sleep 15
            fi
          done

          echo "macOS x64 packaging failed after 3 attempts"
          exit 1
        working-directory: apps/electron

      - name: 验证包内原生模块、终端与 CLI
        run: bun run scripts/smoke-package.ts
        working-directory: apps/electron

      - name: 上传产物（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: mac-x64
          path: |
            apps/electron/out/*.dmg
            apps/electron/out/*.zip
            apps/electron/out/*.blockmap
            apps/electron/out/latest-mac.yml
          if-no-files-found: warn


      - name: 保存架构更新清单
        uses: actions/upload-artifact@v7
        with:
          name: mac-x64-manifest
          path: apps/electron/out/latest-mac.yml
          if-no-files-found: error

  build-linux:
    name: build (linux, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 准备 OfficeCLI（Linux x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: 构建 Electron 应用
        run: bun run electron:build

      - name: 准备运行时依赖
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      - name: 打包并发布 (Linux x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run package:app --linux --${{ matrix.arch }} --publish "$PUBLISH_MODE"
        working-directory: apps/electron

      - name: 验证包内原生模块、终端与 CLI
        run: bun run scripts/smoke-package.ts
        working-directory: apps/electron

      - name: 上传产物（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            apps/electron/out/*.deb
            apps/electron/out/*.AppImage
            apps/electron/out/*.blockmap
            apps/electron/out/latest-linux*.yml
          if-no-files-found: warn

  build-windows:
    name: build (win, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 编译 Windows ARM64 Pi 原生模块
        if: matrix.arch == 'arm64'
        run: bun run node_modules/@earendil-works/pi-tui/native/win32/build.mjs

      # 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（Windows x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 准备运行时依赖
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      - name: 打包并发布 (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # windows-latest 默认 shell 是 pwsh，显式用 bash 才能读取 $PUBLISH_MODE
        shell: bash
        run: bun run package:app --win --${{ matrix.arch }} --publish "$PUBLISH_MODE"
        working-directory: apps/electron

      - name: 验证包内原生模块、终端与 CLI
        run: bun run scripts/smoke-package.ts
        working-directory: apps/electron

      - name: 上传产物（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            apps/electron/out/*.exe
            apps/electron/out/*.blockmap
            apps/electron/out/latest.yml
          if-no-files-found: warn


      - name: 保存架构更新清单
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-manifest
          path: apps/electron/out/latest.yml
          if-no-files-found: error

  merge-update-manifests:
    name: 合并并校验双架构更新清单
    runs-on: ubuntu-latest
    needs: [build-mac-arm64, build-mac-x64, build-windows]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-manifest'
          path: manifests
      - name: 合并更新清单
        run: |
          VERSION=$(bun -e 'process.stdout.write(JSON.parse(await Bun.file("apps/electron/package.json").text()).version)')
          bun run apps/electron/scripts/merge-update-manifests.ts manifests merged "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: merged-update-manifests
          path: merged/*.yml
          if-no-files-found: error
      - name: 更新草稿 Release 的清单
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" merged/latest.yml merged/latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-mac-arm64
      - build-mac-x64
      - build-linux
      - build-windows
      - merge-update-manifests
    # 只有 tag 发布流程的所有平台构建与 mac 更新清单合并均成功后才公开 Release。
    # 手动触发没有 Release，且应只上传 Actions artifacts。
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 校验所有架构安装包与更新清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets | bun run apps/electron/scripts/verify-release-assets.ts "${GITHUB_REF_NAME#v}"

      - name: 生成说明并发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          echo "Generating release notes for ${TAG}"
          RELEASE_NOTES=$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body')
          if [ -z "$RELEASE_NOTES" ] || [ "$RELEASE_NOTES" = "null" ]; then
            echo "ERROR: GitHub generated empty release notes"
            exit 1
          fi

          gh release edit "$TAG" --notes "$RELEASE_NOTES" --draft=false --repo "$GITHUB_REPOSITORY"
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          RELEASE_BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          if [ "$IS_DRAFT" != "false" ] || [ -z "$RELEASE_BODY" ]; then
            echo "ERROR: Release was not published with release notes"
            exit 1
          fi
          echo "Published $TAG with generated release notes"
