<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Locus 应用图标（源文件）
    macOS Big Sur+ 规范：画布 1024x1024，内容区 824x824 居中，圆角 185。

    视觉语义：定位环 + 中心点 + 四向刻度，对应 "Locus"（所在、定位）。
    位图产物（icon.png / icon.ico / icon.icns）由几何参数一致的栅格器生成，
    修改本文件后需同步重新生成位图。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1" />
      <stop offset="1" stop-color="#4338CA" />
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />

  <!-- 定位环 -->
  <circle cx="512" cy="512" r="232" fill="none" stroke="#FFFFFF" stroke-width="52" />

  <!-- 中心点 -->
  <circle cx="512" cy="512" r="64" fill="#FFFFFF" />

  <!-- 四向刻度（胶囊形，端点距中心 300 / 372，半径 24） -->
  <rect x="488" y="116" width="48" height="120" rx="24" fill="#FFFFFF" />
  <rect x="488" y="788" width="48" height="120" rx="24" fill="#FFFFFF" />
  <rect x="116" y="488" width="120" height="48" rx="24" fill="#FFFFFF" />
  <rect x="788" y="488" width="120" height="48" rx="24" fill="#FFFFFF" />
</svg>
